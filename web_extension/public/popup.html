<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FomoTracker — Time Limit Manager</title>
    <meta name="description" content="Track your browsing time on specific websites." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Yellowtail&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Design System ─────────────────────────────────── */
      :root {
        /* Primary palette */
        --primary: #062743;
        --secondary: #113a5d;
        --accent: #c4ffdd;
        --accent-hover: #a2f2c2;
        --glow: rgba(196,255,221,0.5);

        /* Backgrounds */
        --bg-base: #f9f9f9;
        --bg-surface: #ffffff;
        --bg-elevated: #e6eef4;
        --bg-hover: #e6eef4;

        /* Borders */
        --border-subtle: #e1e8ef;
        --border-accent: rgba(6,39,67,0.2);

        /* Text */
        --text-primary: #062743;
        --text-secondary: #506e86;
        --text-muted: #506e86;

        /* Status */
        --success: #10b981;
        --success-bg: rgba(16,185,129,0.1);
        --danger: #ef4444;
        --danger-bg: rgba(239,68,68,0.1);

        /* Mapped aliases used by popup.js inline styles */
        --accent2: #113a5d;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 400px;
        min-height: 560px;
        background: var(--bg-base);
        color: var(--text-primary);
        font-family: 'Poppins', system-ui, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* ── Animations ──────────────────────────────────────── */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @keyframes scaleIn { from { opacity:0; transform:scale(.93); } to { opacity:1; transform:scale(1); } }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

      /* ── Layout ──────────────────────────────────────────── */
      #app { display: flex; flex-direction: column; min-height: 560px; }

      /* ── Header ──────────────────────────────────────────── */
      #header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-surface);
      }
      .logo {
        display: flex; align-items: baseline; gap: 2px;
      }
      .logo-fomo {
        font-family: 'Yellowtail', cursive;
        font-size: 26px;
        color: var(--primary);
        line-height: 1;
      }
      .logo-tracker {
        font-family: 'Poppins', sans-serif;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: var(--primary);
        line-height: 1;
        margin-left: 1px;
        align-self: flex-end;
        margin-bottom: 3px;
      }

      #add-btn {
        display: flex; align-items: center; gap: 5px;
        padding: 8px 16px; border-radius: 12px;
        background: var(--primary);
        color: #ffffff; border: none; cursor: pointer;
        font-family: 'Poppins', sans-serif;
        font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
        box-shadow: 0 2px 12px var(--glow);
        transition: background .15s, transform .15s, box-shadow .15s;
      }
      #add-btn:hover {
        background: var(--secondary);
        transform: scale(1.03);
        box-shadow: 0 4px 18px var(--glow);
      }

      /* ── Tabs ────────────────────────────────────────────── */
      #tabs {
        display: flex; gap: 4px; padding: 14px 20px 0;
        background: var(--bg-surface);
      }
      .tab {
        flex: 1; padding: 8px; border-radius: 12px; border: 1px solid transparent;
        background: transparent; color: var(--text-muted);
        font-family: 'Poppins', sans-serif;
        font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;
        cursor: pointer; transition: all .15s;
      }
      .tab:hover {
        background: rgba(230,238,244,0.5);
      }
      .tab.active {
        background: var(--bg-elevated); color: var(--secondary);
        border-color: var(--border-accent);
      }
      .badge {
        display: inline-flex; align-items: center; justify-content: center;
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--danger); color: white; font-size: 9px; font-weight: 800;
        margin-left: 4px;
      }

      /* ── Content ─────────────────────────────────────────── */
      #content { flex: 1; padding: 14px 20px; overflow-y: auto; }

      /* ── Loading ─────────────────────────────────────────── */
      .spinner {
        width: 24px; height: 24px; border-radius: 50%;
        border: 2px solid var(--border-subtle);
        border-top-color: var(--primary);
        animation: spin .7s linear infinite;
        margin: 60px auto;
      }

      /* ── Empty State ─────────────────────────────────────── */
      #empty {
        display: flex; flex-direction: column; align-items: center;
        padding: 40px 0; text-align: center; animation: fadeIn .3s ease;
      }
      .empty-icon {
        width: 56px; height: 56px; border-radius: 18px;
        background: var(--bg-elevated); border: 1px solid var(--border-subtle);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; margin-bottom: 14px;
      }
      .empty-title {
        font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 4px;
      }
      .empty-sub {
        font-size: 12px; color: var(--text-muted); margin-bottom: 18px;
        line-height: 1.6; max-width: 200px;
      }
      .empty-btn {
        padding: 10px 20px; border-radius: 12px;
        background: var(--primary);
        color: #ffffff; border: none; cursor: pointer;
        font-family: 'Poppins', sans-serif;
        font-size: 13px; font-weight: 600;
        box-shadow: 0 2px 12px var(--glow);
        transition: background .15s, transform .15s;
      }
      .empty-btn:hover {
        background: var(--secondary);
        transform: scale(1.03);
      }

      /* ── Rule Card ───────────────────────────────────────── */
      .rule-card {
        border-radius: 16px; padding: 14px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-surface);
        margin-bottom: 8px;
        animation: fadeIn .3s ease;
        transition: border-color .2s, background .2s;
        position: relative;
      }
      .rule-card:hover {
        border-color: var(--border-accent);
      }
      .rule-card.limit-reached {
        background: linear-gradient(135deg, rgba(239,68,68,0.06), rgba(239,68,68,0.02));
        border-color: rgba(239,68,68,0.2);
      }
      .rule-card.on-break {
        background: linear-gradient(135deg, rgba(16,185,129,0.06), rgba(16,185,129,0.02));
        border-color: rgba(16,185,129,0.2);
      }
      .rule-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
      .rule-info { min-width: 0; display: flex; align-items: center; gap: 8px; }
      .status-dot {
        width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        background: #b0bfc9;
        transition: background .2s, box-shadow .2s;
      }
      .status-dot.active { background: var(--success); box-shadow: 0 0 6px var(--success); }
      .rule-domain {
        font-size: 13px; font-weight: 600; color: var(--primary);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .rule-url {
        font-size: 11px; color: var(--text-muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .rule-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
      .icon-btn {
        width: 28px; height: 28px; border-radius: 8px; border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; transition: all .15s;
        opacity: 0;
      }
      .rule-card:hover .icon-btn { opacity: 1; }
      .edit-btn { background: var(--bg-elevated); color: var(--text-muted); }
      .edit-btn:hover { color: var(--primary); background: #d8e3ed; }
      .del-btn { background: var(--danger-bg); color: var(--danger); }

      /* Toggle */
      .toggle {
        width: 36px; height: 20px; border-radius: 50px; border: none; cursor: pointer;
        background: #c8d4df; position: relative; transition: all .2s;
        flex-shrink: 0;
      }
      .toggle.on {
        background: var(--primary);
        box-shadow: 0 0 10px var(--glow);
      }
      .toggle-thumb {
        position: absolute; top: 2px; left: 2px;
        width: 16px; height: 16px; border-radius: 50%;
        background: white; box-shadow: 0 1px 3px rgba(0,0,0,.15);
        transition: left .2s;
      }
      .toggle.on .toggle-thumb { left: 18px; }

      /* Stats */
      .rule-stats { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .stat-chip {
        display: flex; align-items: center; gap: 4px;
        padding: 4px 10px; border-radius: 8px;
        background: var(--bg-base); color: var(--text-secondary);
        font-size: 11px; border: 1px solid var(--border-subtle);
      }
      .live-chip {
        padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600;
        display: flex; align-items: center; gap: 4px; margin-left: auto;
      }
      .live-chip.danger { background: var(--danger-bg); color: var(--danger); }
      .live-chip.success { background: var(--success-bg); color: var(--success); }
      .live-chip.muted { background: var(--bg-elevated); color: var(--text-muted); }
      .live-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1s infinite; }

      /* ── Active Session Card ─────────────────────────────── */
      .session-card {
        border-radius: 16px; padding: 14px;
        border: 1px solid var(--border-subtle); background: var(--bg-surface);
        margin-bottom: 8px; animation: fadeIn .3s ease;
        transition: border-color .2s;
      }
      .session-card:hover {
        border-color: var(--border-accent);
      }
      .session-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
      .session-domain { font-size: 14px; font-weight: 700; color: var(--primary); }
      .session-sub { font-size: 11px; margin-top: 2px; }
      .session-timer {
        font-size: 26px; font-weight: 800; letter-spacing: -1px;
        font-variant-numeric: tabular-nums; color: var(--primary);
      }
      .progress-track {
        width: 100%; height: 5px; background: var(--bg-elevated);
        border-radius: 3px; overflow: hidden;
      }
      .progress-bar {
        height: 100%; border-radius: 3px; transition: width 1s linear;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
      }

      /* ── No Active ───────────────────────────────────────── */
      .no-active {
        text-align: center; padding: 50px 0; color: var(--text-muted);
        animation: fadeIn .3s ease;
      }
      .no-active-icon { font-size: 30px; margin-bottom: 10px; }
      .no-active-text { font-size: 13px; font-weight: 500; color: var(--text-muted); }
      .no-active-sub { font-size: 11px; margin-top: 4px; opacity: .6; }

      /* ── Footer ──────────────────────────────────────────── */
      #footer {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 20px; border-top: 1px solid var(--border-subtle);
        background: var(--bg-surface);
      }
      #footer span { font-size: 11px; color: var(--text-muted); }

      /* ── Modal ───────────────────────────────────────────── */
      #modal-overlay {
        position: fixed; inset: 0; z-index: 999;
        background: rgba(6,39,67,0.7); backdrop-filter: blur(6px);
        display: none; align-items: center; justify-content: center;
      }
      #modal-overlay.open { display: flex; animation: fadeIn .2s ease; }
      #modal {
        background: var(--bg-surface);
        border: 1px solid var(--border-accent);
        border-radius: 20px; padding: 24px; width: 340px;
        box-shadow: 0 24px 60px rgba(6,39,67,0.15);
        animation: scaleIn .25s ease;
      }
      .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .modal-title {
        font-size: 17px; font-weight: 800;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .modal-close {
        width: 30px; height: 30px; border-radius: 8px;
        background: var(--bg-elevated); border: none; cursor: pointer;
        color: var(--text-muted); font-size: 14px; display: flex;
        align-items: center; justify-content: center;
        transition: color .15s, background .15s;
      }
      .modal-close:hover { color: var(--primary); background: #d8e3ed; }

      .field { margin-bottom: 16px; }
      .field-label {
        display: block; font-size: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .8px;
        color: var(--text-muted); margin-bottom: 8px;
      }
      .field-input {
        width: 100%; padding: 11px 14px; border-radius: 12px;
        background: var(--bg-base); color: var(--text-primary);
        border: 1px solid var(--border-subtle); font-size: 13px;
        font-family: inherit; outline: none;
        transition: border-color .15s, box-shadow .15s;
      }
      .field-input:focus {
        border-color: var(--secondary);
        box-shadow: 0 0 0 3px rgba(6,39,67,0.08);
      }
      .field-input.error { border-color: var(--danger); }
      .field-error { font-size: 11px; color: var(--danger); margin-top: 4px; }

      .slider-row { display: flex; align-items: center; gap: 10px; }
      input[type=range] {
        flex: 1; height: 4px; cursor: pointer;
        accent-color: var(--primary);
      }
      .slider-val {
        min-width: 44px; text-align: center; padding: 6px 0;
        border-radius: 10px; background: var(--bg-base);
        border: 1px solid var(--border-subtle);
        font-size: 12px; font-weight: 700; color: var(--secondary);
        font-variant-numeric: tabular-nums;
      }

      .summary-box {
        padding: 10px 14px; border-radius: 12px; margin-bottom: 16px;
        background: rgba(6,39,67,0.06); border: 1px solid rgba(6,39,67,0.12);
        font-size: 11px; line-height: 1.7; color: var(--text-secondary);
      }
      .summary-box .hl-accent { color: var(--secondary); font-weight: 600; }
      .summary-box .hl-domain { color: var(--primary); font-weight: 600; }
      .summary-box .hl-success { color: var(--success); font-weight: 600; }

      .btn-row { display: flex; gap: 10px; }
      .btn-cancel {
        flex: 1; padding: 11px; border-radius: 12px;
        background: var(--bg-elevated); color: var(--text-secondary);
        border: none; cursor: pointer; font-size: 13px; font-weight: 500;
        font-family: inherit; transition: background .15s;
      }
      .btn-cancel:hover { background: #d8e3ed; }
      .btn-save {
        flex: 1; padding: 11px; border-radius: 12px;
        background: var(--primary);
        color: #ffffff; border: none; cursor: pointer;
        font-size: 13px; font-weight: 700; font-family: inherit;
        box-shadow: 0 2px 12px var(--glow);
        transition: background .15s, transform .15s;
      }
      .btn-save:hover { background: var(--secondary); transform: scale(1.02); }

      /* scrollbar */
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div class="logo">
          <span class="logo-fomo">Fomo</span>
          <span class="logo-tracker">Tracker</span>
        </div>
        <button id="add-btn">
          <span style="font-size:16px;line-height:1">+</span>
          Add Rule
        </button>
      </header>

      <div id="tabs">
        <button class="tab active" data-tab="rules" id="tab-rules">All Rules</button>
        <button class="tab" data-tab="active" id="tab-active">
          Active <span class="badge" id="active-badge" style="display:none">0</span>
        </button>
      </div>

      <div id="content">
        <div class="spinner"></div>
      </div>

      <footer id="footer">
        <span id="footer-total">0 rules</span>
        <span id="footer-enabled">0 active</span>
      </footer>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" style="display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 560px; text-align: center; padding: 40px; background: var(--bg-base);">
      <div class="logo" style="justify-content: center; margin-bottom: 30px;">
        <span class="logo-fomo" style="font-size: 42px;">Fomo</span>
        <span class="logo-tracker" style="font-size: 14px; margin-bottom: 6px;">Tracker</span>
      </div>
      <div class="empty-icon" style="background: rgba(6,39,67,0.06); color: var(--primary);">
        🔒
      </div>
      <h2 class="empty-title" style="font-size: 18px;">Authentication Required</h2>
      <div class="empty-sub" style="max-width: 260px; margin-bottom: 20px; font-size: 13px; color: var(--text-muted);">Please login to your FomoTracker dashboard to use the extension and sync your rules.</div>
      <button id="login-btn" class="empty-btn" style="width: 100%; padding: 12px; font-size: 14px; margin-top: 10px;">
        Login via Web
      </button>
    </div>

    <!-- Modal -->
    <div id="modal-overlay">
      <div id="modal">
        <div class="modal-header">
          <span class="modal-title" id="modal-title">New Rule</span>
          <button class="modal-close" id="modal-close">✕</button>
        </div>

        <form id="rule-form">
          <input type="hidden" id="edit-id" value="" />

          <div class="field">
            <label class="field-label" for="name-input">Label / Name</label>
            <input type="text" id="name-input" class="field-input"
              placeholder="e.g. YouTube Entertainment" autocomplete="off" />
          </div>

          <div class="field">
            <label class="field-label" for="url-input">Website URL</label>
            <input type="text" id="url-input" class="field-input"
              placeholder="e.g. youtube.com or twitter.com" autocomplete="off" />
            <div class="field-error" id="url-error"></div>
          </div>

          <div class="summary-box" id="summary-box">
            FomoTracker will track how much time you spend on <span class="hl-domain" id="sum-domain">this site</span> and automatically sync it to your dashboard.
          </div>

          <div class="btn-row">
            <button type="button" class="btn-cancel" id="modal-cancel">Cancel</button>
            <button type="submit" class="btn-save" id="modal-save">Add Rule</button>
          </div>
        </form>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
